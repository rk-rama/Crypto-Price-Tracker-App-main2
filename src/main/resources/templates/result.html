<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Prices | Market Data</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --dark-bg: #0f172a;
        }

        body {
            background-color: var(--dark-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
        }

        .brand-logo-container {
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px;
            overflow: hidden;
        }

        .navbar-brand span {
            font-weight: 800; background: var(--primary-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .card-table {
            background: #ffffff; border-radius: 24px; border: none; overflow: hidden;
            color: #1e293b; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .table thead th {
            background: #f8fafc; color: #64748b; font-weight: 700; padding: 20px;
            text-transform: uppercase; font-size: 0.8rem;
        }

        .table tbody td { padding: 20px; vertical-align: middle; font-weight: 600; }

        .green { color: #10b981 !important; background: rgba(16, 185, 129, 0.1); padding: 5px 12px; border-radius: 8px; }
        .red { color: #ef4444 !important; background: rgba(239, 68, 68, 0.1); padding: 5px 12px; border-radius: 8px; }

        .btn-back { background: #f1f5f9; color: #475569; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 700; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <div class="brand-logo-container">
                <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" alt="" style="width: 24px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <i class="fa-solid fa-coins text-warning fs-5" style="display:none;"></i>
            </div>
            <span class="fs-3">CryptoTracker</span>
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card card-table">
        <div class="p-4 d-flex justify-content-between align-items-center">
            <h3 class="m-0 fw-bold">Live Market Data</h3>
            <a href="/" class="btn btn-back btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
        </div>
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Coin Name</th>
                    <th>Price (USD)</th>
                    <th class="text-end">24h Change</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="coin : ${coins}">
                    <td class="fw-bold" th:text="${coin.name}">Bitcoin</td>
                    <td th:text="${'$' + coin.price}">$0.00</td>
                    <td class="text-end">
                            <span th:text="${coin.change24h + '%'}"
                                  th:classappend="${coin.change24h >= 0} ? 'green' : 'red'">
                            </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
