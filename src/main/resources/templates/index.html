<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker | Premium Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --dark-bg: #0f172a;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Navbar Styling */
        .navbar {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo-container {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 5px;
        }

        .navbar-brand span {
            font-weight: 800;
            font-size: 1.6rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: #94a3b8 !important;
            font-weight: 600;
            margin-left: 20px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #fff !important;
        }

        /* Main Card Styling */
        .main-container {
            height: calc(100vh - 100px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-custom {
            background: #ffffff;
            border-radius: 28px;
            padding: 45px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            color: #1e293b;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-header {
            width: 70px;
            height: 70px;
            background: #f1f5f9;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            color: #6366f1;
        }

        h2 {
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .form-label {
            font-weight: 700;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 10px;
        }

        .form-control-lg {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-control-lg:focus {
            background: #fff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-custom {
            background: var(--primary-gradient);
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            margin-top: 15px;
            transition: all 0.4s ease;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        .trending-chips {
            margin-top: 25px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .chip {
            background: #f1f5f9;
            padding: 5px 12px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <div class="brand-logo-container">
                <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png"
                     alt="logo"
                     style="width: 28px; height: 28px; object-fit: contain;"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <i class="fa-solid fa-coins fs-4 text-warning" style="display:none;"></i>
            </div>
            <span>CryptoTracker</span>
        </a>

        <div class="ms-auto d-none d-md-flex">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="#">Market</a>
            <a class="nav-link" href="#">Alerts</a>
        </div>
    </div>
</nav>

<div class="container main-container">
    <div class="card card-custom">
        <div class="text-center">
            <div class="icon-header">
                <i class="fa-solid fa-chart-line fa-2x"></i>
            </div>
            <h2>Smart Tracker</h2>
            <p class="text-muted mb-4">Track real-time prices and set alerts.</p>
        </div>

        <form action="/track" method="post">
            <div class="mb-4">
                <label class="form-label text-uppercase">Assets to Track</label>
                <input type="text"
                       name="coins"
                       class="form-control form-control-lg"
                       placeholder="e.g. bitcoin, solana, cardano"
                       required>
            </div>

            <button type="submit" class="btn btn-custom w-100">
                Track Live Prices <i class="fa-solid fa-bolt-lightning ms-2"></i>
            </button>
        </form>

        <div class="trending-chips">
            <span class="chip">#bitcoin</span>
            <span class="chip">#ethereum</span>
            <span class="chip">#solana</span>
        </div>
    </div>
</div>

</body>
</html>
